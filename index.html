<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My MacBook Live Camera</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px auto;
            padding: 0 16px;
            max-width: 800px;
        }

        img {
            width: 100%;
            max-width: 640px;
            height: auto;
            border-radius: 8px;
            background: #222;
        }
    </style>
</head>
<body>
    <h1>My Live Camera</h1>
    <p>Live video from my MacBook camera</p>

    <img
        src="https://127.0.0.1:5000/video_feed"
        alt="Live camera stream"
    >

    <p>
        The feed is available only while the camera
        server and public tunnel are running.
    </p>
</body>
</html>
